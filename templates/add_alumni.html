<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Alumni</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="sidebar">

    <div class="logo">

        <div class="logo-icon">🎓</div>

        <span>Alumni Hub</span>

    </div>


    <div class="nav-menu">

        <a href="{{ url_for('index') }}">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>

        <a href="{{ url_for('dashboard') }}">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
        </a>

        <a href="{{ url_for('alumni') }}">
            <span class="nav-icon">👥</span>
            <span>Alumni</span>
        </a>

        <a href="{{ url_for('add_alumni') }}"
           class="active">

            <span class="nav-icon">➕</span>
            <span>Register</span>

        </a>

        <a href="{{ url_for('events') }}">
            <span class="nav-icon">📅</span>
            <span>Events</span>
        </a>

    </div>

</div>


<div class="main">

    <div class="topbar">

        <div class="page-title">

            <h1>Register Alumni ✨</h1>

            <p>Add a new member to your alumni community.</p>

        </div>

        <div class="avatar">TA</div>

    </div>


    <div class="card">

        <div class="card-header">

            <h2>📝 Alumni Information</h2>

        </div>


        <form method="POST">

            <div class="form-grid">


                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        name="first_name"
                        placeholder="Enter first name"
                        required>

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        name="last_name"
                        placeholder="Enter last name"
                        required>

                </div>


                <div class="form-group">

                    <label>Date of Birth</label>

                    <input
                        type="date"
                        name="dob"
                        required>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender">

                        <option value="">Select gender</option>

                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>

                    </select>

                </div>


                <div class="form-group full">

                    <label>Correspondence Address</label>

                    <input
                        type="text"
                        name="address"
                        placeholder="Enter current address">

                </div>


                <div class="form-group full">

                    <label>Official Address</label>

                    <input
                        type="text"
                        name="official_address"
                        placeholder="Enter official address">

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required>

                </div>


                <div class="form-group">

                    <label>Mobile Number</label>

                    <input
                        type="text"
                        name="mobile"
                        placeholder="Enter mobile number"
                        required>

                </div>


                <div class="form-group">

                    <label>Current City</label>

                    <input
                        type="text"
                        name="city"
                        placeholder="Enter city">

                </div>


                <div class="form-group">

                    <label>Company</label>

                    <input
                        type="text"
                        name="company"
                        placeholder="Enter company">

                </div>


                <div class="form-group">

                    <label>Designation</label>

                    <input
                        type="text"
                        name="designation"
                        placeholder="Software Engineer">

                </div>


                <div class="form-group">

                    <label>Branch</label>

                    <select name="branch">

                        <option value="">Select branch</option>

                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>ME</option>
                        <option>CE</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Session From</label>

                    <input
                        type="number"
                        name="session_from"
                        placeholder="2020">

                </div>


                <div class="form-group">

                    <label>Session To</label>

                    <input
                        type="number"
                        name="session_to"
                        placeholder="2024">

                </div>


            </div>


            <div class="form-actions">

                <button
                    type="submit"
                    class="btn btn-primary">

                    🎓 Register Alumni

                </button>


                <a
                    href="{{ url_for('alumni') }}"
                    class="btn btn-secondary">

                    ↩ Cancel

                </a>

            </div>

        </form>

    </div>


    <footer>
        🎓 Alumni Hub © 2026
    </footer>

</div>

</body>

</html>
