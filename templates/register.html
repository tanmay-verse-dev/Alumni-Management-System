<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Alumni</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="{{ url_for('index') }}"
           class="logo">

            <i class="fa-solid fa-user-graduate"></i>

            Alumni<span>Connect</span>

        </a>

        <div class="nav-links">

            <a href="{{ url_for('index') }}"
               class="nav-link">

                <i class="fa-solid fa-house"></i>
                Dashboard

            </a>

            <a href="{{ url_for('alumni') }}"
               class="nav-link">

                <i class="fa-solid fa-users"></i>
                Alumni

            </a>

            <a href="{{ url_for('register') }}"
               class="nav-link active">

                <i class="fa-solid fa-user-plus"></i>
                Register

            </a>

            <a href="{{ url_for('events') }}"
               class="nav-link">

                <i class="fa-solid fa-calendar-days"></i>
                Events

            </a>

        </div>

    </div>

</nav>


<section class="page-section">

    <div class="page-header">

        <div>

            <p class="section-label">
                <i class="fa-solid fa-user-plus"></i>
                NEW MEMBER
            </p>

            <h1>
                Register Alumni
            </h1>

            <p>
                Add a new member to the alumni directory.
            </p>

        </div>

    </div>


    <form method="POST"
          action="{{ url_for('register_alumni') }}"
          class="form-card">


        <h2>
            <i class="fa-solid fa-user"></i>
            Personal Information
        </h2>


        <div class="form-grid">

            <div class="form-group">

                <label>
                    First Name *
                </label>

                <input type="text"
                       name="first_name"
                       required
                       placeholder="Enter first name">

            </div>


            <div class="form-group">

                <label>
                    Last Name *
                </label>

                <input type="text"
                       name="last_name"
                       required
                       placeholder="Enter last name">

            </div>


            <div class="form-group">

                <label>
                    Date of Birth
                </label>

                <input type="date"
                       name="dob">

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select name="gender">

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group full">

                <label>
                    Correspondence Address
                </label>

                <textarea name="add_corr"
                          rows="3"
                          placeholder="Enter current address"></textarea>

            </div>


            <div class="form-group full">

                <label>
                    Official Address
                </label>

                <textarea name="add_offc"
                          rows="3"
                          placeholder="Enter official address"></textarea>

            </div>


            <div class="form-group">

                <label>
                    Email *
                </label>

                <input type="email"
                       name="email_add"
                       required
                       placeholder="example@gmail.com">

            </div>


            <div class="form-group">

                <label>
                    Mobile Number *
                </label>

                <input type="tel"
                       name="mob_no"
                       required
                       placeholder="Enter mobile number">

            </div>


            <div class="form-group">

                <label>
                    Current City
                </label>

                <input type="text"
                       name="curr_city"
                       placeholder="Enter city">

            </div>


        </div>


        <h2 class="form-heading">

            <i class="fa-solid fa-briefcase"></i>

            Professional & Academic Information

        </h2>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Company / Organization
                </label>

                <input type="text"
                       name="curr_company"
                       placeholder="Company name">

            </div>


            <div class="form-group">

                <label>
                    Designation
                </label>

                <input type="text"
                       name="desg"
                       placeholder="Current designation">

            </div>


            <div class="form-group">

                <label>
                    Session From
                </label>

                <input type="number"
                       name="session_from"
                       placeholder="2020">

            </div>


            <div class="form-group">

                <label>
                    Session To
                </label>

                <input type="number"
                       name="session_to"
                       placeholder="2024">

            </div>


            <div class="form-group">

                <label>
                    Branch
                </label>

                <input type="text"
                       name="branch"
                       placeholder="CSE / IT / ECE etc.">

            </div>

        </div>


        <div class="form-actions">

            <a href="{{ url_for('alumni') }}"
               class="btn btn-secondary">

                Cancel

            </a>

            <button type="submit"
                    class="btn btn-primary">

                <i class="fa-solid fa-user-plus"></i>

                Register Alumni

            </button>

        </div>


    </form>

</section>

</body>
</html>
